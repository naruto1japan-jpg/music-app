<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harmony Flow - Music Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0a0a;
      --bg-secondary: #141414;
      --bg-tertiary: #1e1e1e;
      --text-primary: #ffffff;
      --text-secondary: #a0a0a0;
      --accent: #6e56cf;
      --accent-hover: #8e4ec6;
      --border: #2a2a2a;
      --success: #30a46c;
      --error: #e5484d;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      overflow-x: hidden;
    }

    .app {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
      padding-bottom: 120px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 2rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .search-section {
      margin-bottom: 40px;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 12px 16px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--accent);
    }

    button {
      padding: 12px 24px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    button:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .music-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .music-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s;
    }

    .music-card:hover {
      border-color: var(--accent);
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(110, 86, 207, 0.15);
    }

    .music-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent);
    }

    .card-image {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      background: var(--bg-tertiary);
    }

    .card-content {
      padding: 16px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-artist {
      font-size: 0.875rem;
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      padding: 16px;
      z-index: 1000;
    }

    .player-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .player-info {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .player-thumbnail {
      width: 60px;
      height: 60px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--bg-tertiary);
    }

    .player-text {
      flex: 1;
      min-width: 0;
    }

    .player-title {
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .player-artist {
      font-size: 0.875rem;
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: center;
    }

    .control-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      padding: 0;
      min-width: unset;
    }

    .control-btn.play-pause {
      width: 48px;
      height: 48px;
      background: var(--accent);
      border-color: var(--accent);
    }

    .progress {
      width: 100%;
      height: 4px;
      background: var(--bg-tertiary);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.1s linear;
    }

    .youtube-container {
      position: fixed;
      top: -9999px;
      left: -9999px;
      width: 640px;
      height: 360px;
      pointer-events: none;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
    }

    .error {
      background: rgba(229, 72, 77, 0.1);
      border: 1px solid var(--error);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      color: var(--error);
    }

    @media (max-width: 768px) {
      .app {
        padding: 16px;
        padding-bottom: 140px;
      }

      h1 {
        font-size: 1.5rem;
      }

      .music-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 12px;
      }

      .player-controls {
        flex-wrap: wrap;
      }
    }

    .icon {
      width: 20px;
      height: 20px;
    }

    .section-title {
      font-size: 1.5rem;
      margin-bottom: 20px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>🎵 Harmony Flow</h1>
      <div style="color: var(--text-secondary); font-size: 0.875rem;">YouTube Music Player</div>
    </header>

    <section class="search-section">
      <h2 class="section-title">Search Music</h2>
      <div class="search-box">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search for songs on YouTube..."
          onkeypress="if(event.key==='Enter') searchMusic()"
        />
        <button onclick="searchMusic()">Search</button>
      </div>
      <div id="searchResults"></div>
    </section>

    <section>
      <h2 class="section-title">Your Library</h2>
      <div id="musicGrid" class="music-grid"></div>
    </section>
  </div>

  <div class="player">
    <div class="player-content">
      <div class="progress" id="progressBar" onclick="seekTo(event)">
        <div class="progress-bar" id="progressFill"></div>
      </div>
      
      <div class="player-info">
        <img id="playerThumbnail" class="player-thumbnail" src="" alt="">
        <div class="player-text">
          <div class="player-title" id="playerTitle">No track playing</div>
          <div class="player-artist" id="playerArtist">Select a song to start</div>
        </div>
      </div>

      <div class="player-controls">
        <button class="control-btn" onclick="previousTrack()">
          <svg class="icon" fill="currentColor" viewBox="0 0 24 24">
            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
          </svg>
        </button>
        <button class="control-btn play-pause" onclick="togglePlayPause()">
          <svg id="playIcon" class="icon" fill="currentColor" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <svg id="pauseIcon" class="icon" fill="currentColor" viewBox="0 0 24 24" style="display: none;">
            <path d="M6 4h4v16H6zm8 0h4v16h-4z"/>
          </svg>
        </button>
        <button class="control-btn" onclick="nextTrack()">
          <svg class="icon" fill="currentColor" viewBox="0 0 24 24">
            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div class="youtube-container">
    <div id="ytPlayer"></div>
  </div>

  <script>
    // Default music library
    const defaultMusic = [
      {
        id: 'dQw4w9WgXcQ',
        title: 'Never Gonna Give You Up',
        artist: 'Rick Astley',
        thumbnail: 'https://img.youtube.com/vi/dQw4w9WgXcQ/mqdefault.jpg'
      },
      {
        id: 'kJQP7kiw5Fk',
        title: 'Despacito',
        artist: 'Luis Fonsi ft. Daddy Yankee',
        thumbnail: 'https://img.youtube.com/vi/kJQP7kiw5Fk/mqdefault.jpg'
      },
      {
        id: 'fJ9rUzIMcZQ',
        title: 'Bohemian Rhapsody',
        artist: 'Queen',
        thumbnail: 'https://img.youtube.com/vi/fJ9rUzIMcZQ/mqdefault.jpg'
      },
      {
        id: '60ItHLz5WEA',
        title: 'Faded',
        artist: 'Alan Walker',
        thumbnail: 'https://img.youtube.com/vi/60ItHLz5WEA/mqdefault.jpg'
      },
      {
        id: 'RgKAFK5djSk',
        title: 'Waka Waka',
        artist: 'Shakira',
        thumbnail: 'https://img.youtube.com/vi/RgKAFK5djSk/mqdefault.jpg'
      },
      {
        id: 'CevxZvSJLk8',
        title: 'Roar',
        artist: 'Katy Perry',
        thumbnail: 'https://img.youtube.com/vi/CevxZvSJLk8/mqdefault.jpg'
      }
    ];

    let player;
    let currentTrackIndex = 0;
    let musicLibrary = [...defaultMusic];
    let isPlaying = false;
    let searchResults = [];

    // YouTube API initialization
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('ytPlayer', {
        height: '360',
        width: '640',
        videoId: musicLibrary[0].id,
        playerVars: {
          autoplay: 1,
          mute: 1, // Start muted for autoplay policy
          controls: 0,
          disablekb: 1,
          fs: 0,
          modestbranding: 1,
          playsinline: 1,
          enablejsapi: 1,
          rel: 0,
          vq: 'small',
          origin: window.location.origin
        },
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange
        }
      });
    }

    function onPlayerReady(event) {
      console.log('YouTube player ready');
      // Unmute after player is ready
      event.target.unMute();
      event.target.setVolume(100);
      updateUI();
      startProgressTracking();
    }

    function onPlayerStateChange(event) {
      console.log('Player state:', event.data);
      
      if (event.data === YT.PlayerState.ENDED) {
        nextTrack();
      } else if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        updatePlayPauseButton();
      } else if (event.data === YT.PlayerState.PAUSED) {
        isPlaying = false;
        updatePlayPauseButton();
      } else if (event.data === YT.PlayerState.BUFFERING) {
        console.log('Buffering...');
        // Retry playback if stuck in buffering for too long
        setTimeout(() => {
          if (player && player.getPlayerState && player.getPlayerState() === YT.PlayerState.BUFFERING && isPlaying) {
            console.log('Stuck in buffering, attempting recovery...');
            try {
              player.playVideo();
            } catch (error) {
              console.error('Recovery failed:', error);
            }
          }
        }, 3000);
      } else if (event.data === YT.PlayerState.CUED) {
        console.log('Video cued');
      }
    }

    function playTrack(index) {
      if (index < 0 || index >= musicLibrary.length) return;
      
      currentTrackIndex = index;
      const track = musicLibrary[currentTrackIndex];
      
      if (player && player.loadVideoById) {
        try {
          player.loadVideoById({
            videoId: track.id,
            startSeconds: 0,
            suggestedQuality: 'small'
          });
          
          // Unmute and play immediately
          player.unMute();
          player.setVolume(100);
          
          // Play with a small delay to ensure video is loaded
          setTimeout(() => {
            player.playVideo();
          }, 100);
          
          isPlaying = true;
          updateUI();
        } catch (error) {
          console.error('Error playing track:', error);
          // Reload on critical error
          window.location.reload();
        }
      } else {
        console.error('Player not ready');
      }
    }

    function togglePlayPause() {
      if (!player || !player.getPlayerState) {
        console.error('Player not ready');
        return;
      }
      
      try {
        const state = player.getPlayerState();
        
        if (state === YT.PlayerState.PLAYING) {
          player.pauseVideo();
          isPlaying = false;
        } else {
          // Ensure unmuted before playing
          player.unMute();
          player.setVolume(100);
          player.playVideo();
          isPlaying = true;
        }
        
        updatePlayPauseButton();
      } catch (error) {
        console.error('Error toggling play/pause:', error);
      }
    }

    function nextTrack() {
      const nextIndex = (currentTrackIndex + 1) % musicLibrary.length;
      playTrack(nextIndex);
    }

    function previousTrack() {
      const prevIndex = currentTrackIndex === 0 ? musicLibrary.length - 1 : currentTrackIndex - 1;
      playTrack(prevIndex);
    }

    function seekTo(event) {
      if (!player || !player.getDuration) return;
      
      const progressBar = event.currentTarget;
      const rect = progressBar.getBoundingClientRect();
      const percent = (event.clientX - rect.left) / rect.width;
      const duration = player.getDuration();
      
      player.seekTo(duration * percent);
    }

    function updateUI() {
      const track = musicLibrary[currentTrackIndex];
      
      document.getElementById('playerTitle').textContent = track.title;
      document.getElementById('playerArtist').textContent = track.artist;
      document.getElementById('playerThumbnail').src = track.thumbnail;
      
      renderMusicGrid();
    }

    function updatePlayPauseButton() {
      const playIcon = document.getElementById('playIcon');
      const pauseIcon = document.getElementById('pauseIcon');
      
      if (isPlaying) {
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
      } else {
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
      }
    }

    function startProgressTracking() {
      setInterval(() => {
        if (player && player.getCurrentTime && player.getDuration) {
          const current = player.getCurrentTime();
          const duration = player.getDuration();
          const percent = (current / duration) * 100;
          
          document.getElementById('progressFill').style.width = percent + '%';
        }
      }, 100);
    }

    function renderMusicGrid() {
      const grid = document.getElementById('musicGrid');
      grid.innerHTML = musicLibrary.map((track, index) => `
        <div class="music-card ${index === currentTrackIndex ? 'active' : ''}" onclick="playTrack(${index})">
          <img class="card-image" src="${track.thumbnail}" alt="${track.title}">
          <div class="card-content">
            <div class="card-title">${track.title}</div>
            <div class="card-artist">${track.artist}</div>
          </div>
        </div>
      `).join('');
    }

    async function searchMusic() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      const resultsContainer = document.getElementById('searchResults');
      resultsContainer.innerHTML = '<div class="loading">Searching YouTube...</div>';

      try {
        const API_KEY = 'AIzaSyC6nB-fjZjLYy7uSCSld74v1odXiOBDcas';
        const response = await fetch(
          `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoCategoryId=10&maxResults=6&q=${encodeURIComponent(query)}&key=${API_KEY}`
        );
        
        if (!response.ok) {
          throw new Error('Search failed. Please add a valid YouTube API key.');
        }

        const data = await response.json();
        searchResults = data.items.map(item => ({
          id: item.id.videoId,
          title: item.snippet.title,
          artist: item.snippet.channelTitle,
          thumbnail: item.snippet.thumbnails.medium.url
        }));

        renderSearchResults();
      } catch (error) {
        resultsContainer.innerHTML = `
          <div class="error">
            <strong>Search Error:</strong> ${error.message}
            <br><br>
            <small>To enable search, replace YOUR_YOUTUBE_API_KEY_HERE in the code with a valid YouTube Data API v3 key from Google Cloud Console.</small>
          </div>
        `;
      }
    }

    function renderSearchResults() {
      const resultsContainer = document.getElementById('searchResults');
      
      if (searchResults.length === 0) {
        resultsContainer.innerHTML = '<div class="loading">No results found</div>';
        return;
      }

      resultsContainer.innerHTML = `
        <div class="music-grid">
          ${searchResults.map((track, index) => `
            <div class="music-card" onclick="addToLibrary(${index})">
              <img class="card-image" src="${track.thumbnail}" alt="${track.title}">
              <div class="card-content">
                <div class="card-title">${track.title}</div>
                <div class="card-artist">${track.artist}</div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function addToLibrary(index) {
      const track = searchResults[index];
      
      // Check if already in library
      if (!musicLibrary.find(t => t.id === track.id)) {
        musicLibrary.push(track);
        updateUI();
        alert(`Added "${track.title}" to your library!`);
      } else {
        alert('This track is already in your library!');
      }
    }

    // Initialize
    renderMusicGrid();

    // Load YouTube API
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
  </script>
</body>
</html>
